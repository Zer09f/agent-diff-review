[workspace]
members = [
  "crates/core",
  "crates/git_patch",
  "crates/cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/agent-diff-review/agent-diff-review"
homepage = "https://github.com/agent-diff-review/agent-diff-review"

[workspace.dependencies]
agent-diff-core = { path = "crates/core" }
agent-diff-git-patch = { path = "crates/git_patch" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
walkdir = "2.5"

