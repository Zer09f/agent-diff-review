name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  cli:
    name: Build CLI (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: win32-x64
            os: windows-latest
          - name: win32-arm64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: darwin-x64
            os: macos-15-intel
          - name: darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform.name == 'win32-arm64'
        run: rustup target add aarch64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:release
        env:
          ADR_TARGET_PLATFORM: ${{ matrix.platform.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: dist/release/*

  vscode:
    name: Package VS Code (${{ matrix.target }})
    needs: cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - win32-arm64
          - linux-x64
          - darwin-x64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release
      - name: Unpack CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-cli
          if [[ "${{ matrix.target }}" == win32-* ]]; then
            unzip -q dist/release/adr-v*-*.zip -d tmp-cli
            cli_binary="$(find tmp-cli -type f -name adr.exe | head -n 1)"
          else
            tar -xzf dist/release/adr-v*-*.tar.gz -C tmp-cli
            cli_binary="$(find tmp-cli -type f -name adr | head -n 1)"
          fi
          test -n "$cli_binary"
          cp "$cli_binary" target-adr
      - run: node scripts/sync-binaries.mjs --platform ${{ matrix.target }} --source target-adr
      - run: npm run build --workspace packages/vscode-extension
      - run: npm run package --workspace packages/vscode-extension -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ matrix.target }}
          path: packages/vscode-extension/*.vsix

  opencode:
    name: Package OpenCode npm tarball
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: platform-artifacts
      - name: Sync platform binaries
        shell: bash
        run: |
          set -euo pipefail
          for dir in platform-artifacts/release-*; do
            target="${dir##*/release-}"
            rm -rf "$dir/unpacked"
            mkdir -p "$dir/unpacked"
            if [[ "$target" == win32-* ]]; then
              unzip -q "$dir"/adr-v*-*.zip -d "$dir/unpacked"
              cli_binary="$(find "$dir/unpacked" -type f -name adr.exe | head -n 1)"
            else
              tar -xzf "$dir"/adr-v*-*.tar.gz -C "$dir/unpacked"
              cli_binary="$(find "$dir/unpacked" -type f -name adr | head -n 1)"
            fi
            test -n "$cli_binary"
            node scripts/sync-binaries.mjs --platform "$target" --source "$cli_binary"
          done
      - run: npm run build --workspace packages/opencode-plugin
      - run: npm pack --workspace packages/opencode-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-npm
          path: agent-diff-review-opencode-plugin-*.tgz

  publish:
    name: Create GitHub Release
    needs:
      - cli
      - opencode
      - vscode
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
